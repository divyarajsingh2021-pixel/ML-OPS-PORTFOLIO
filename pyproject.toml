[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for Hinglish (Hindi-English, Roman script) sentiment classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "hinglish-mlops contributors" }]
keywords = ["mlops", "hinglish", "nlp", "sentiment", "code-mixed"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    "mlflow>=2.11",
    "datasets>=2.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "evidently>=0.4.16",
    "streamlit>=1.33",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "invoke>=2.2",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/your-username/hinglish-mlops"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["hinglish_mlops"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest + coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["hinglish_mlops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
